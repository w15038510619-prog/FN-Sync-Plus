name: Build and Release FN Sync Plus

on:
  push:
    branches: [ "main", "master", "feature/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore FNSyncPlus/FNSyncPlus.sln

    - name: Build Solution
      run: dotnet build FNSyncPlus/FNSyncPlus.sln -c Release --no-restore

    - name: Run Automated Tests
      run: dotnet run --project FNSyncPlus/FNSyncPlus.Tests/FNSyncPlus.Tests.csproj -c Release

    - name: Publish Self-Contained Single-File Executable
      run: >
        dotnet publish FNSyncPlus/FNSyncPlus.App/FNSyncPlus.App.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -o publish/

    - name: Rename Output Executable
      shell: pwsh
      run: |
        if (Test-Path publish/FNSyncPlus.App.exe) {
          Copy-Item publish/FNSyncPlus.App.exe publish/FN_Sync_Plus.exe -Force
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FN_Sync_Plus_v2.2_Win64
        path: publish/FN_Sync_Plus.exe
