name: Build and Release FN Sync Plus

on:
  push:
    branches: [ "main", "master", "feature/**" ]
  pull_request:
    branches: [ "main", "master", "feature/v2.1-multitask-and-modern-ui" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 凭据扫描：私钥、保存的凭据、以及任何被误提交的签名材料都必须在这里失败，
    # 而不是等到打包后才发现。
    - name: Scan Repository for Credentials and Private Keys
      shell: pwsh
      run: |
        $tracked = & git ls-files
        if ($LASTEXITCODE -ne 0) { throw 'git ls-files 失败，无法执行凭据扫描' }
        $bad = @()
        foreach ($file in $tracked) {
          if ($file -match '(?i)(^|/)(credentials\.dat|update-private\.pem|\.env(\..*)?)$') {
            $bad += "凭据文件: $file"
            continue
          }
          if ($file -match '(?i)\.(cs|ps1|psm1|json|yml|yaml|md|txt|xaml|csproj|props|targets|sln)$') {
            $content = Get-Content -LiteralPath $file -Raw -ErrorAction SilentlyContinue
            if ($content -match '-----BEGIN [A-Z ]*PRIVATE KEY-----') { $bad += "私钥内容: $file" }
          }
        }
        if ($bad.Count -gt 0) {
          $bad | ForEach-Object { Write-Host "FAIL $_" }
          throw "仓库中发现凭据或私钥（$($bad.Count) 项），已阻止构建"
        }
        Write-Host "凭据扫描通过：检查了 $($tracked.Count) 个受版本管理的文件"

    - name: Restore Dependencies
      run: dotnet restore FNSyncPlus/FNSyncPlus.sln

    - name: Build Solution
      run: dotnet build FNSyncPlus/FNSyncPlus.sln -c Release --no-restore

    - name: Run Isolated Integrity Regressions
      run: dotnet run --project FNSyncPlus/FNSyncPlus.Tests/FNSyncPlus.Tests.csproj -c Release -- --integrity-regressions

    # 多账号隔离：任务归属（UID/账号名）与隔离会话沙盒都必须拦截跨账号访问。
    - name: Run Multi-Account Isolation Acceptance
      run: dotnet run --project FNSyncPlus/FNSyncPlus.Tests/FNSyncPlus.Tests.csproj -c Release -- --account-isolation

    # P0 整改专项：维护租约、发布信任链、数据格式守卫、后台更新调度。
    - name: Run P0 Remediation Suite
      run: dotnet run --project FNSyncPlus/FNSyncPlus.Tests/FNSyncPlus.Tests.csproj -c Release -- --p0-tests

    - name: Run Automated Tests
      run: dotnet run --project FNSyncPlus/FNSyncPlus.Tests/FNSyncPlus.Tests.csproj -c Release

    - name: Publish WinUI 3 Desktop Application (v0.4.0-beta)
      if: github.event_name != 'pull_request' || github.base_ref != 'feature/v2.1-multitask-and-modern-ui'
      run: >
        dotnet publish FNSyncPlus/FNSyncPlus.WinUI/FNSyncPlus.WinUI.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:WindowsPackageType=None
        -o publish_winui/

    - name: Ensure Resources PRI in Publish Output
      if: github.event_name != 'pull_request' || github.base_ref != 'feature/v2.1-multitask-and-modern-ui'
      shell: pwsh
      run: |
        if ((Test-Path "publish_winui/FNSyncPlus.WinUI.pri") -and !(Test-Path "publish_winui/resources.pri")) {
          Copy-Item -Path "publish_winui/FNSyncPlus.WinUI.pri" -Destination "publish_winui/resources.pri" -Force
        }

    - name: Compress WinUI 3 Release to ZIP
      if: github.event_name != 'pull_request' || github.base_ref != 'feature/v2.1-multitask-and-modern-ui'
      shell: pwsh
      run: |
        Compress-Archive -Path publish_winui/* -DestinationPath publish_winui/FN_Sync_Plus_v0.4.0-beta_WinUI3_x64.zip -Force

    - name: Publish Legacy WPF Single-File Executable
      if: github.event_name != 'pull_request' || github.base_ref != 'feature/v2.1-multitask-and-modern-ui'
      run: >
        dotnet publish FNSyncPlus/FNSyncPlus.App/FNSyncPlus.App.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -o publish/

    - name: Rename Output Executable
      if: github.event_name != 'pull_request' || github.base_ref != 'feature/v2.1-multitask-and-modern-ui'
      shell: pwsh
      run: |
        if (Test-Path publish/FNSyncPlus.App.exe) {
          Copy-Item publish/FNSyncPlus.App.exe publish/FN_Sync_Plus.exe -Force
        }

    - name: Upload WinUI 3 Artifact
      if: github.event_name != 'pull_request' || github.base_ref != 'feature/v2.1-multitask-and-modern-ui'
      uses: actions/upload-artifact@v4
      with:
        name: FN_Sync_Plus_v0.4.0-beta_WinUI3_x64
        path: publish_winui/FN_Sync_Plus_v0.4.0-beta_WinUI3_x64.zip

    - name: Upload Legacy WPF Artifact
      if: github.event_name != 'pull_request' || github.base_ref != 'feature/v2.1-multitask-and-modern-ui'
      uses: actions/upload-artifact@v4
      with:
        name: FN_Sync_Plus_v2.2_WPF
        path: publish/FN_Sync_Plus.exe
