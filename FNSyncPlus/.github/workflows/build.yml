name: Build and Release FN Sync Plus

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore FNSyncPlus.sln

    - name: Build Solution
      run: dotnet build FNSyncPlus.sln -c Release --no-restore

    - name: Run Core Automated Tests
      run: dotnet test FNSyncPlus.Tests/FNSyncPlus.Tests.csproj -c Release --no-build --verbosity normal

    - name: Publish Self-Contained Single-File Executable
      run: >
        dotnet publish FNSyncPlus.App/FNSyncPlus.App.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -o publish/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FN_Sync_Plus_Win64
        path: publish/FNSyncPlus.App.exe
